name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

# No external toolchain auto-upgrade if the setup-go version differs from go.mod.
env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  GOPROXY: off
  GOSUMDB: off
  GOVCS: "*:off"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint GitHub Actions with checksum-verified actionlint
        shell: bash
        run: ./scripts/check-workflows.sh

  change-records:
    # Also execute on merge_group: do not make required checks silently skip.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # In fork PRs, the checkout default is the synthetic merge commit.
          # Checkout the exact HEAD that the coverage diff names instead.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Prepare Go modules before offline checks
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        shell: bash
        run: |
          set -euo pipefail
          go mod download all
          go mod verify
          module_status=$(git status --porcelain --untracked-files=all -- go.mod go.sum)
          if [ -n "$module_status" ]; then
            git status --short -- go.mod go.sum
            git diff -- go.mod go.sum
            echo 'Module manifests changed during CI preparation; prepare and review them locally.' >&2
            exit 1
          fi
      - name: Validate pending change records (all events)
        run: go run ./tools/release changes validate
      - name: Validate change-impact coverage (pull requests)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          go run ./tools/release changes validate
          --base "$PR_BASE"
          --head "$PR_HEAD"

  contract-locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Prepare Go modules before offline checks
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        shell: bash
        run: |
          set -euo pipefail
          go mod download all
          go mod verify
          module_status=$(git status --porcelain --untracked-files=all -- go.mod go.sum)
          if [ -n "$module_status" ]; then
            git status --short -- go.mod go.sum
            git diff -- go.mod go.sum
            echo 'Module manifests changed during CI preparation; prepare and review them locally.' >&2
            exit 1
          fi
      - name: Verify CLI contract locks
        run: go run ./tools/release contracts check

  public-go-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Prepare Go modules before offline checks
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        shell: bash
        run: |
          set -euo pipefail
          go mod download all
          go mod verify
          module_status=$(git status --porcelain --untracked-files=all -- go.mod go.sum)
          if [ -n "$module_status" ]; then
            git status --short -- go.mod go.sum
            git diff -- go.mod go.sum
            echo 'Module manifests changed during CI preparation; prepare and review them locally.' >&2
            exit 1
          fi
      - name: Verify public Go API compatibility lock
        run: go run ./tools/release api check

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-15-intel
            arch: amd64
          - os: macos-15
            arch: arm64
          - os: windows-2025
            arch: amd64
          - os: windows-11-vs2026-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Prepare Go modules before offline checks
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        shell: bash
        run: |
          set -euo pipefail
          go mod download all
          go mod verify
          module_status=$(git status --porcelain --untracked-files=all -- go.mod go.sum)
          if [ -n "$module_status" ]; then
            git status --short -- go.mod go.sum
            git diff -- go.mod go.sum
            echo 'Module manifests changed during CI preparation; prepare and review them locally.' >&2
            exit 1
          fi
      - name: Format (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l cli cmd internal integration tools)"
          test -z "$unformatted" || { printf 'unformatted: %s\n' "$unformatted" >&2; exit 1; }
      - name: Format (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $unformatted = @(gofmt -l cli cmd internal integration tools)
          if ($LASTEXITCODE -ne 0) { throw "gofmt failed with $LASTEXITCODE" }
          if ($unformatted.Count -ne 0) {
            # Write-Error is terminating under ErrorAction Stop, so list every
            # path first and fail once. A checkout rewritten to CRLF otherwise
            # hides every file after the first.
            $listed = ($unformatted | ForEach-Object { "unformatted: $_" }) -join [Environment]::NewLine
            throw $listed
          }
      - run: go test ./...
      - run: go vet ./...
      - run: go test -shuffle=on -count=3 ./...
      - name: Verify Windows race toolchain
        if: runner.os == 'Windows' && matrix.arch == 'amd64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = (& gcc --print-file-name libsynchronization.a | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "gcc failed with $LASTEXITCODE" }
          if ([string]::IsNullOrWhiteSpace($runtime) -or $runtime -eq 'libsynchronization.a' -or -not (Test-Path -LiteralPath $runtime -PathType Leaf)) {
            throw "Windows race detector requires a mingw-w64 runtime providing libsynchronization.a; gcc returned '$runtime'"
          }
      - name: Race detector
        if: runner.os != 'Windows' || matrix.arch == 'amd64'
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...
      - name: Verify native Windows primitive surface
        if: runner.os == 'Windows'
        shell: pwsh
        run: go test -count=1 -v ./internal/filelock ./internal/fscommit ./internal/aiprofile ./internal/aiprofile/platform ./internal/repozip
      - name: Verify native PowerShell completion on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: go test ./cli -count=1 -v -run 'TestPowerShellNativeCompletionBehaviorWhereAvailable'

  native-shell-completion:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Prepare Go modules before offline checks
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        shell: bash
        run: |
          set -euo pipefail
          go mod download all
          go mod verify
          module_status=$(git status --porcelain --untracked-files=all -- go.mod go.sum)
          if [ -n "$module_status" ]; then
            git status --short -- go.mod go.sum
            git diff -- go.mod go.sum
            echo 'Module manifests changed during CI preparation; prepare and review them locally.' >&2
            exit 1
          fi
      - name: Install native completion test shells with verified Nushell
        shell: bash
        run: ./scripts/install-test-shells.sh
      - name: Verify native shell test surface
        shell: bash
        run: |
          set -euo pipefail
          for shell in bash fish nu zsh pwsh; do
            command -v "$shell"
          done
          go test ./cli -count=1 -v -run 'Test(BashAdapterSyntaxAndNULTransport|FishNativeCompletionBehaviorWhereAvailable|NushellNativeCompletionBehaviorWhereAvailable|ZshNativeCompletionBehaviorWhereAvailable|PowerShellNativeCompletionBehaviorWhereAvailable|NativeShellSyntaxWhereAvailable)$'

  cross-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Prepare Go modules before offline checks
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        shell: bash
        run: |
          set -euo pipefail
          go mod download all
          go mod verify
          module_status=$(git status --porcelain --untracked-files=all -- go.mod go.sum)
          if [ -n "$module_status" ]; then
            git status --short -- go.mod go.sum
            git diff -- go.mod go.sum
            echo 'Module manifests changed during CI preparation; prepare and review them locally.' >&2
            exit 1
          fi
      - name: Cross-build compile-only targets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t commands < <(find cmd -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | LC_ALL=C sort)
          test "${#commands[@]}" -gt 0

          for target in 'darwin amd64' 'darwin arm64' 'linux amd64' 'linux arm64' 'windows amd64' 'windows arm64'; do
            read -r goos goarch <<<"$target"
            for command in "${commands[@]}"; do
              echo "building $command for $goos/$goarch"
              GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
                go build -trimpath -o /tmp/cli-tools-cross-build ./cmd/"$command"
            done
          done
