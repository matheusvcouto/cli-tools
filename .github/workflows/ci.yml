name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  change-records:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
      - name: Validate change-impact coverage
        shell: bash
        run: >-
          go run ./tools/release changes validate
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.sha }}"

  contract-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
      - name: Verify CLI contract locks
        run: go run ./tools/release contracts check

  public-go-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
      - name: Verify public Go API compatibility lock
        run: go run ./tools/release api check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
      - name: Format
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: go vet ./...
      - run: go test -shuffle=on -count=3 ./...
      - run: go test -race ./...

  native-shell-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
      - name: Install Fish and Zsh test shells
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fish zsh
      - name: Install pinned Nushell test binary
        shell: bash
        env:
          NU_VERSION: '0.114.1'
          NU_SHA256: 'ce3a1c5a07c784098b5675224a165e73a45f0f720a8392791d7c3a5b4720255e'
        run: |
          set -euo pipefail
          asset="nu-${NU_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${asset}"
          curl --fail --location --proto '=https' --tlsv1.2 --output "/tmp/${asset}" "$url"
          printf '%s  %s\n' "$NU_SHA256" "/tmp/${asset}" | sha256sum -c -
          tar -xzf "/tmp/${asset}" -C /tmp
          install -m 0755 "/tmp/nu-${NU_VERSION}-x86_64-unknown-linux-musl/nu" /usr/local/bin/nu
          nu --version
      - name: Verify native shell test surface
        shell: bash
        run: |
          set -euo pipefail
          for shell in bash fish nu zsh pwsh; do
            command -v "$shell"
          done
          go test ./cli -count=1 -v -run 'Test(BashAdapterSyntaxAndNULTransport|FishNativeCompletionBehaviorWhereAvailable|NushellNativeCompletionBehaviorWhereAvailable|ZshNativeCompletionBehaviorWhereAvailable|PowerShellNativeCompletionBehaviorWhereAvailable|NativeShellSyntaxWhereAvailable)$'

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
      - name: Cross-build compile-only targets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t commands < <(find cmd -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | LC_ALL=C sort)
          test "${#commands[@]}" -gt 0

          for target in 'darwin amd64' 'darwin arm64' 'linux amd64' 'linux arm64' 'windows amd64' 'windows arm64'; do
            read -r goos goarch <<<"$target"
            for command in "${commands[@]}"; do
              echo "building $command for $goos/$goarch"
              GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
                go build -trimpath -o /tmp/cli-tools-cross-build ./cmd/"$command"
            done
          done
