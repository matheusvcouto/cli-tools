name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
      - name: Format
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: go vet ./...
      - run: go test -shuffle=on -count=3 ./...
      - run: go test -race ./...
      - name: Verify public Go API compatibility lock
        run: go run ./tools/release api check
      - name: Verify CLI contract locks
        run: go run ./tools/release contracts check

  native-shell-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
      - name: Install Fish and Zsh test shells
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fish zsh
      - name: Install pinned Nushell test binary
        shell: bash
        env:
          NU_VERSION: '0.114.1'
          NU_SHA256: 'ce3a1c5a07c784098b5675224a165e73a45f0f720a8392791d7c3a5b4720255e'
        run: |
          set -euo pipefail
          asset="nu-${NU_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${asset}"
          curl --fail --location --proto '=https' --tlsv1.2 --output "/tmp/${asset}" "$url"
          printf '%s  %s\n' "$NU_SHA256" "/tmp/${asset}" | sha256sum -c -
          tar -xzf "/tmp/${asset}" -C /tmp
          install -m 0755 "/tmp/nu-${NU_VERSION}-x86_64-unknown-linux-musl/nu" /usr/local/bin/nu
      - name: Verify native shell completion behavior
        shell: bash
        run: |
          set -euo pipefail
          for shell in bash fish nu zsh pwsh; do
            command -v "$shell"
          done
          go test ./cli -count=1 -v -run 'Test(BashAdapterSyntaxAndNULTransport|FishNativeCompletionBehaviorWhereAvailable|NushellNativeCompletionBehaviorWhereAvailable|ZshNativeCompletionBehaviorWhereAvailable|PowerShellNativeCompletionBehaviorWhereAvailable|NativeShellSyntaxWhereAvailable)$'

  publish:
    needs: [verify, native-shell-completion]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          check-latest: false
      - name: Build release and extract versioned notes
        shell: bash
        run: |
          go run ./tools/release \
            --version "${GITHUB_REF_NAME}" \
            --changelog CHANGELOG.md \
            --notes-out "${RUNNER_TEMP}/release-notes.md" \
            --out dist
      - name: Smoke-test Linux archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          asset="dist/cli-tools_${version#v}_linux_amd64.tar.gz"
          test -f "$asset"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          tar -xzf "$asset" -C "$tmp"
          count=0
          for binary in "$tmp"/bin/*; do
            test -f "$binary"
            test -x "$binary"
            name="$(basename "$binary")"
            product_version="$(jq -r .version "cmd/$name/tool.json")"
            test "$("$binary" --version)" = "$name $product_version"
            test "$("$binary" version --json | jq -r .suite_version)" = "$version"
            count=$((count + 1))
          done
          test "$count" -gt 0
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Attest release archives
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Create GitHub release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "CLI Tools ${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --verify-tag
